name: Import secrets and variables to Depot CI

on:
    push:
        branches:
            - depot-migrate-secrets-p8nk1rswbz

permissions:
    id-token: write
    contents: read

jobs:
    repository-secrets:
        runs-on: ubuntu-latest
        outputs:
            names: ${{ steps.import.outputs.names }}
        steps:
            - uses: depot/setup-action@v1
            - name: Import available repository secrets
              id: import
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
                  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  VERTEX_SERVICE_ACCOUNT_JSON: ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
                  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
              run: |
                  set -euo pipefail
                  unset DEPOT_TOKEN

                  secret_names=(
                    ANTHROPIC_API_KEY
                    AWS_ACCESS_KEY_ID
                    AWS_BEARER_TOKEN_BEDROCK
                    AWS_SECRET_ACCESS_KEY
                    CLAUDE_CODE_OAUTH_TOKEN
                    DEEPSEEK_API_KEY
                    GEMINI_API_KEY
                    GOOGLE_GENERATIVE_AI_API_KEY
                    MOONSHOT_API_KEY
                    OPENAI_API_KEY
                    OPENAI_COMPATIBLE_API_KEY
                    OPENCODE_API_KEY
                    OPENROUTER_API_KEY
                    VERTEX_SERVICE_ACCOUNT_JSON
                    XAI_API_KEY
                  )
                  imported_names=()

                  for name in "${secret_names[@]}"; do
                    value="${!name:-}"
                    if [[ -z "$value" ]]; then
                      continue
                    fi

                    printf '%s' "$value" |
                      depot ci secrets add "$name" --repo "$GITHUB_REPOSITORY"
                    imported_names+=("$name")
                  done

                  names_json="$(
                    printf '%s\n' "${imported_names[@]}" |
                      jq -Rsc 'split("\n") | map(select(length > 0))'
                  )"
                  echo "names=$names_json" >> "$GITHUB_OUTPUT"

    npm-bootstrap-secret:
        environment:
            name: npm-bootstrap-release
            deployment: false
        runs-on: ubuntu-latest
        outputs:
            names: ${{ steps.import.outputs.names }}
        steps:
            - uses: depot/setup-action@v1
            - name: Import available npm bootstrap secret
              id: import
              env:
                  NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
              run: |
                  set -euo pipefail
                  unset DEPOT_TOKEN

                  imported_names=()
                  if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
                    printf '%s' "$NPM_BOOTSTRAP_TOKEN" |
                      depot ci secrets add NPM_BOOTSTRAP_TOKEN \
                        --repo "$GITHUB_REPOSITORY" \
                        --env npm-bootstrap-release
                    imported_names+=(NPM_BOOTSTRAP_TOKEN)
                  fi

                  names_json="$(
                    printf '%s\n' "${imported_names[@]}" |
                      jq -Rsc 'split("\n") | map(select(length > 0))'
                  )"
                  echo "names=$names_json" >> "$GITHUB_OUTPUT"

    verify:
        needs:
            - repository-secrets
            - npm-bootstrap-secret
        runs-on: ubuntu-latest
        steps:
            - uses: depot/setup-action@v1
              with:
                  oidc: true
            - name: Verify imported secret names
              env:
                  REPOSITORY_SECRET_NAMES: ${{ needs.repository-secrets.outputs.names }}
                  ENVIRONMENT_SECRET_NAMES: ${{ needs.npm-bootstrap-secret.outputs.names }}
              run: |
                  set -euo pipefail

                  depot ci secrets list \
                    --repo "$GITHUB_REPOSITORY" \
                    --output json >/dev/null

                  mapfile -t repository_names < <(jq -r '.[]' <<< "$REPOSITORY_SECRET_NAMES")
                  mapfile -t environment_names < <(jq -r '.[]' <<< "$ENVIRONMENT_SECRET_NAMES")
                  imported_count=$((${#repository_names[@]} + ${#environment_names[@]}))

                  if ((imported_count == 0)); then
                    echo "No GitHub secrets were available to migrate." >&2
                    exit 1
                  fi

                  for name in "${repository_names[@]}"; do
                    depot ci secrets get "$name" \
                      --repo "$GITHUB_REPOSITORY" \
                      --output json >/dev/null
                  done

                  for name in "${environment_names[@]}"; do
                    depot ci secrets get "$name" \
                      --repo "$GITHUB_REPOSITORY" \
                      --env npm-bootstrap-release \
                      --output json >/dev/null
                  done

                  printf 'Verified %d Depot secret name(s):\n' "$imported_count"
                  printf '  %s\n' "${repository_names[@]}" "${environment_names[@]}"

    cleanup:
        needs: [verify]
        if: ${{ needs.verify.result == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Delete migration branch
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
                  if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
                    echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
                    exit 1
                  fi
                  gh api --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
