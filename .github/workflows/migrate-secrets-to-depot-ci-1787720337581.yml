name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERTEX_SERVICE_ACCOUNT_JSON: ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" AWS_BEARER_TOKEN_BEDROCK="$AWS_BEARER_TOKEN_BEDROCK" AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" GEMINI_API_KEY="$GEMINI_API_KEY" GOOGLE_GENERATIVE_AI_API_KEY="$GOOGLE_GENERATIVE_AI_API_KEY" MOONSHOT_API_KEY="$MOONSHOT_API_KEY" NPM_BOOTSTRAP_TOKEN="$NPM_BOOTSTRAP_TOKEN" OPENAI_API_KEY="$OPENAI_API_KEY" OPENAI_COMPATIBLE_API_KEY="$OPENAI_COMPATIBLE_API_KEY" OPENCODE_API_KEY="$OPENCODE_API_KEY" OPENROUTER_API_KEY="$OPENROUTER_API_KEY" VERTEX_SERVICE_ACCOUNT_JSON="$VERTEX_SERVICE_ACCOUNT_JSON" XAI_API_KEY="$XAI_API_KEY" --repo ue-shed/ue-shed
  cleanup:
    needs: [secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
          if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
            echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
