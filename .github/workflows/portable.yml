# Portable is the only hosted repository gate. Unreal evidence and releases remain explicit local
# workflows until their hosted designs have been rewritten and exercised.
#
# The repository and UAsset jobs run on boat.dev VMs; the short jobs stay on GitHub-hosted runners
# because each boat job counts against the plan's start limits. scripts/ci-runner.ts asks boat how
# many starts are left and sends both jobs to GitHub-hosted runners when the run would not fit, or
# when there is no BOAT_API_KEY secret, as on pull requests from forks.

name: Portable
on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
env:
    # Keep hosted builds reproducible; update deliberately after verifying both UAsset suites.
    RUSTUP_TOOLCHAIN: "1.98.1"
concurrency:
    group: portable-${{ github.ref }}
    cancel-in-progress: true
jobs:
    changes:
        name: Validate CI inputs and select checks
        runs-on: ubuntu-24.04
        # actions: read lets a release-notes-only push confirm that the previous head's run passed.
        permissions:
            actions: read
            contents: read
        outputs:
            catalog_oracle: ${{ steps.scope.outputs.catalog_oracle }}
            heavy_runner: ${{ steps.runner.outputs.heavy_runner }}
            reuse_previous_run: ${{ steps.scope.outputs.reuse_previous_run }}
            site: ${{ steps.scope.outputs.site }}
            uasset_io: ${{ steps.scope.outputs.uasset_io }}
            uasset_libraries: ${{ steps.scope.outputs.uasset_libraries }}
        steps:
            - name: Checkout repository history
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "26"
            - name: Validate dependency paths before installation
              run: node scripts/check-dependency-paths.ts
            - name: Check CI selection and dependency regressions
              run: >-
                  node --test scripts/ci-scope.test.ts scripts/ci-runner.test.ts
                  scripts/check-dependency-paths.test.ts
            - name: Select affected checks
              id: scope
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_ACTION: ${{ github.event.action }}
                  GITHUB_TOKEN: ${{ github.token }}
                  BEFORE_SHA: ${{ github.event.before }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/ci-scope.ts
            - name: Choose runners for the repository and UAsset jobs
              id: runner
              env:
                  BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
                  BOAT_ORG: ${{ vars.BOAT_ORG }}
                  UASSET_IO: ${{ steps.scope.outputs.uasset_io }}
                  UASSET_LIBRARIES: ${{ steps.scope.outputs.uasset_libraries }}
              run: node scripts/ci-runner.ts
    repository:
        name: Repository checks
        needs: changes
        runs-on: ${{ needs.changes.outputs.heavy_runner }}
        timeout-minutes: 90
        steps:
            - name: Checkout without persisted credentials
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - name: Install pnpm
              uses: pnpm/action-setup@v6
            - name: Install Python for benchmark snapshot checks
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Check benchmark source snapshots
              if: needs.changes.outputs.reuse_previous_run != 'true'
              run: python -m unittest discover -s tools/benchmarks -p 'test_source_snapshot.py' -v
            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "26"
                  cache: pnpm
            - name: Install Rust
              run: |
                  rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            # Only release notes changed since a passing run of the same code: check the release text.
            - name: Check release notes
              if: needs.changes.outputs.reuse_previous_run == 'true'
              run: pnpm run format:check && pnpm run test:release
            - name: Run repository gate
              id: repository_gate
              if: needs.changes.outputs.reuse_previous_run != 'true'
              shell: bash
              run: |
                  set -o pipefail
                  mkdir -p evidence
                  pnpm run check:repository 2>&1 | tee evidence/portable-check.log
            - name: Run Game Text join fuzz sweep
              if: needs.changes.outputs.reuse_previous_run != 'true'
              env:
                  UE_SHED_JOIN_FUZZ_SEEDS: "100"
              run: pnpm test:game-text:fuzz
            - name: Upload portable evidence
              if: always() && steps.repository_gate.outcome != 'skipped'
              uses: actions/upload-artifact@v7
              with:
                  name: portable-evidence-${{ github.run_id }}
                  path: evidence/portable-check.log
                  if-no-files-found: error
                  retention-days: 30
            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: portable-failure-${{ github.run_id }}
                  path: |
                      test-results/**
                      coverage/**
                  if-no-files-found: ignore
                  retention-days: 14
    # One job runs both UAsset suites so they share one setup and one boat start. Each suite runs
    # when its inputs changed; IO still runs after a library failure so one push reports both.
    uasset:
        name: UAsset
        needs: changes
        if: >-
            needs.changes.outputs.uasset_libraries == 'true' ||
            needs.changes.outputs.uasset_io == 'true'
        runs-on: ${{ needs.changes.outputs.heavy_runner }}
        timeout-minutes: 90
        env:
            SCCACHE_GHA_ENABLED: "true"
            CARGO_INCREMENTAL: "0"
            RUSTC_WRAPPER: sccache
            SCCACHE_BASEDIRS: ${{ github.workspace }}
            SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
            SCCACHE_LOG: warn
            SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
        steps:
            - name: Checkout without persisted credentials
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - name: Configure GitHub Actions compiler cache
              uses: mozilla-actions/sccache-action@v0.0.11
            - name: Install pnpm
              uses: pnpm/action-setup@v6
            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "26"
                  cache: pnpm
            - name: Install Rust UAsset toolchains
              run: |
                  rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
                  rustup target add wasm32-unknown-unknown
            - name: Install prebuilt wasm-pack
              uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
              with:
                  tool: wasm-pack@0.14.0
                  fallback: none
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            - name: Install Chromium for browser tests
              if: needs.changes.outputs.uasset_libraries == 'true'
              run: pnpm --filter @ue-shed/workbench exec playwright install --with-deps --only-shell chromium
            - name: Build TypeScript packages
              id: build
              shell: bash
              run: |
                  set -o pipefail
                  mkdir -p evidence
                  pnpm run build:typescript-packages 2>&1 | tee evidence/uasset-build.log
            - name: Run UAsset library gate
              if: needs.changes.outputs.uasset_libraries == 'true'
              shell: bash
              run: |
                  set -o pipefail
                  pnpm run uasset:check:libraries 2>&1 | tee evidence/uasset-libraries-check.log
            - name: Run UAsset IO gate
              if: >-
                  !cancelled() && steps.build.outcome == 'success' &&
                  needs.changes.outputs.uasset_io == 'true'
              shell: bash
              run: |
                  set -o pipefail
                  pnpm run uasset:check:io 2>&1 | tee evidence/uasset-io-check.log
                  node scripts/test.ts \
                      apps/cli/src/index.e2e.test.ts \
                      apps/cli/src/localization-status.integration.test.ts \
                      packages/unreal-assets/src/fixture.integration.test.ts \
                      packages/unreal-assets/src/project-index-process.test.ts \
                      packages/game-text/src/fixture.integration.test.ts \
                      packages/game-text/src/native-index-builder.integration.test.ts \
                      packages/game-text/src/native-index-builder-regressions.integration.test.ts \
                      packages/game-text/src/native-package-delta.integration.test.ts \
                      scripts/native-game-text-join.test.ts \
                      packages/enhanced-input/src/dogfood.integration.test.ts \
                      2>&1 | tee -a evidence/uasset-io-check.log
            - name: Collect compiler cache diagnostics
              if: always()
              shell: bash
              run: |
                  mkdir -p evidence
                  sccache --show-stats --stats-format=json > evidence/sccache-stats.json
                  if [[ -f "$SCCACHE_ERROR_LOG" ]]; then
                      cp "$SCCACHE_ERROR_LOG" evidence/sccache.log
                  fi
            - name: Upload UAsset evidence
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: uasset-evidence-${{ github.run_id }}
                  path: |
                      evidence/uasset-build.log
                      evidence/uasset-libraries-check.log
                      evidence/uasset-io-check.log
                      evidence/sccache-stats.json
                      evidence/sccache.log
                  if-no-files-found: error
                  retention-days: 30
            - name: Upload UAsset failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: uasset-failure-${{ github.run_id }}
                  path: test-results/**
                  if-no-files-found: ignore
                  retention-days: 14
    catalog_oracle:
        name: SQLite Catalog oracle
        needs: changes
        if: needs.changes.outputs.catalog_oracle == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout without persisted credentials
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - name: Install Rust
              run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
            - name: Run Catalog differential and recovery tests
              shell: bash
              run: |
                  set -o pipefail
                  mkdir -p evidence
                  cargo test --locked -p uasset-io --lib --features catalog-oracle catalog_sqlite:: \
                      2>&1 | tee evidence/catalog-oracle.log
                  cargo test --locked -p uasset-io --lib --features catalog-oracle \
                      deterministic_mutation_sequences_match_sqlite_on_every_page \
                      2>&1 | tee -a evidence/catalog-oracle.log
            - name: Upload Catalog oracle evidence
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: catalog-oracle-${{ github.run_id }}
                  path: evidence/catalog-oracle.log
                  if-no-files-found: error
                  retention-days: 30
    site:
        name: Website and illustrated guides
        needs: changes
        if: needs.changes.outputs.site == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "26"
                  cache: pnpm
            - name: Install Rust UAsset toolchains
              run: |
                  rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
                  rustup target add wasm32-unknown-unknown
            - name: Install prebuilt wasm-pack
              uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
              with:
                  tool: wasm-pack@0.14.0
                  fallback: none
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @ue-shed/workbench exec playwright install --with-deps --only-shell chromium
            - name: Run website gate
              id: site_gate
              run: pnpm site:check
            - name: Upload desktop and mobile website captures
              if: always() && steps.site_gate.outcome != 'skipped'
              uses: actions/upload-artifact@v7
              with:
                  name: website-evidence-${{ github.run_id }}
                  path: test-results/site/**
                  if-no-files-found: error
                  retention-days: 14
    gate:
        name: pnpm check
        needs:
            - changes
            - repository
            - site
            - uasset
            - catalog_oracle
        if: always()
        runs-on: ubuntu-24.04
        steps:
            - name: Verify portable jobs
              shell: bash
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  REPOSITORY_RESULT: ${{ needs.repository.result }}
                  SITE_RESULT: ${{ needs.site.result }}
                  UASSET_RESULT: ${{ needs.uasset.result }}
                  CATALOG_ORACLE_RESULT: ${{ needs.catalog_oracle.result }}
              run: |
                  set -euo pipefail
                  [[ "$CHANGES_RESULT" == "success" ]]
                  [[ "$REPOSITORY_RESULT" == "success" ]]
                  [[ "$SITE_RESULT" == "success" || "$SITE_RESULT" == "skipped" ]]
                  [[ "$UASSET_RESULT" == "success" || "$UASSET_RESULT" == "skipped" ]]
                  [[ "$CATALOG_ORACLE_RESULT" == "success" || "$CATALOG_ORACLE_RESULT" == "skipped" ]]
