[package]
name = "engine-process-supervisor"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Windows Job Object launcher for scoped UE Shed editor sessions"
license = "MIT"
repository = "https://github.com/ue-shed/ue-shed"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_IO",
	"Win32_System_JobObjects",
	"Win32_System_SystemServices",
	"Win32_System_Threading"
] }

[[bin]]
name = "ue-shed-process-supervisor"
path = "src/main.rs"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
