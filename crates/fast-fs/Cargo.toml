[package]
name = "fast-fs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Operating system change journals for UE Shed's content indexes"
repository = "https://github.com/ue-shed/ue-shed"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_System_Ioctl"
] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
