[package]
name = "game-text-index"
version = "0.21.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native Game Text index construction for uasset-io"

[dependencies]
crc32fast = "=1.5.0"
memchr = "=2.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
regex = "=1.12.2"
icu_collator = "=2.1.1"
rayon = "1.11"
zstd = "0.13"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
file-id = "=0.2.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
