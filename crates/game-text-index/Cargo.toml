[package]
name = "game-text-index"
version = "0.21.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native Game Text index construction for uasset-io"

[dependencies]
crc32fast = "=1.5.0"
memchr = "=2.8.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2.14", features = ["serde"] }
regex = "=1.12.2"
icu_collator = "=2.1.1"
icu_locale = "=2.1.1"
icu_provider = "=2.3.1"
fancy-regex = "=0.16.2"
ryu-js = "=1.0.2"
rayon = "1.11"
zstd = "0.13"
fsst-rs = "0.6"
sha2 = "0.10"
rustc-hash = "=2.1.3"
process-metrics = { path = "../process-metrics" }

[dev-dependencies]
ts-rs = "12.0"

[features]
# Count live heap in test builds, for memory attribution runs. Off for timing runs: the counters
# cost every allocation.
heap-counting = []
benchmark-timings = []
# A `probe` request that holds, panics or aborts, for the session's failure tests.
engine-probes = []

[target.'cfg(windows)'.dependencies]
file-id = "=0.2.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
