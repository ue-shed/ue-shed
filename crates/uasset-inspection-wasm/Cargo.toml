[package]
name = "uasset-inspection-wasm"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly binding for UE Shed's read-only UAsset inspection"
license = "MIT"
repository = "https://github.com/ue-shed/ue-shed"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uasset-inspection = { path = "../uasset-inspection" }
uasset-parser = { path = "../uasset-parser" }
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
