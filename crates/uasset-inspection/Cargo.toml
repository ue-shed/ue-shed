[package]
name = "uasset-inspection"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Portable inspection projections for Unreal Engine asset packages"
license = "MIT"
repository = "https://github.com/ue-shed/ue-shed"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uasset-parser = { path = "../uasset-parser" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
