[package]
name = "uasset-io"
version = "0.33.0"
edition = "2024"
rust-version = "1.89"
description = "Filesystem and process-facing IO for Unreal Engine asset inspection"
license = "MIT"
repository = "https://github.com/ue-shed/ue-shed"

[dependencies]
game-text-index = { path = "../game-text-index" }
atomic-write-file = { version = "=0.3.0", default-features = false }
crc32fast = "=1.5.0"
fast-fs = { path = "../fast-fs" }
mimalloc = { version = "=0.1.52", default-features = false }
process-metrics = { path = "../process-metrics" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uasset-inspection = { path = "../uasset-inspection" }
uasset-parser = { path = "../uasset-parser" }
unreal-code = { path = "../unreal-code" }
zstd = "0.13"

[features]
benchmark-timings = ["game-text-index/benchmark-timings"]
engine-probes = ["game-text-index/engine-probes"]
reader-memory-probes = []

[lib]
name = "uasset_io"
path = "src/lib.rs"

[[bin]]
name = "uasset"
path = "src/bin/uasset.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
# A malformed package or bad input must be a typed error, never a panic. Invariants that
# genuinely hold use `#[expect]` with a reason; tests may unwrap (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
