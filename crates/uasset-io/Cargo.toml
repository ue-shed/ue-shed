[package]
name = "uasset-io"
version = "0.1.0-rc.4"
edition = "2024"
rust-version = "1.88"
description = "Filesystem and process-facing IO for Unreal Engine asset inspection"
license = "MIT"
repository = "https://github.com/ue-shed/ue-shed"

[dependencies]
atomic-write-file = { version = "=0.3.0", default-features = false }
duckdb = { version = "=1.10505.0", default-features = false, features = [
	"appender-arrow",
	"bundled"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uasset-inspection = { path = "../uasset-inspection" }
uasset-parser = { path = "../uasset-parser" }

[dev-dependencies]
# Cutover oracle only; remove with catalog_sqlite.rs after the DuckDB soak period.
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"] }

[lib]
name = "uasset_io"
path = "src/lib.rs"

[[bin]]
name = "uasset"
path = "src/bin/uasset.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
