[package]
name = "uasset-parser"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only parser for classic Unreal Engine asset packages"
license = "MIT"
repository = "https://github.com/ue-shed/ue-shed"

[lib]
name = "uasset_parser"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
