[package]
name = "uasset-source-gen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Unreal source-to-UAsset serialization model generator"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uasset-parser = { path = "../uasset-parser" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
# A malformed package or bad input must be a typed error, never a panic. Invariants that
# genuinely hold use `#[expect]` with a reason; tests may unwrap (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
