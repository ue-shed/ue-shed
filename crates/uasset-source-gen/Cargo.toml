[package]
name = "uasset-source-gen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Experimental Unreal source-to-UAsset serialization model generator"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uasset-parser = { path = "../uasset-parser" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
