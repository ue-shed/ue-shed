[package]
name = "unreal-code"
version = "0.23.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Reads an Unreal project's code as Unreal's tools do; first, its GatherTextFromSource text gather"

[dependencies]
aho-corasick = "=1.1.5"
memchr = "=2.8.3"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "12.0", optional = true }

[features]
# TypeScript declarations for the Game Text engine's generated contract.
ts = ["dep:ts-rs"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
