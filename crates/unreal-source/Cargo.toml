[package]
name = "unreal-source"
version = "0.23.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Unreal's source text gather (GatherTextFromSource) as a native token scanner"

[dependencies]
aho-corasick = "=1.1.5"
memchr = "=2.8.3"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
