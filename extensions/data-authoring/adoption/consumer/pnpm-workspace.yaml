packages:
    - "app"
    - "server"
    - "packages/*"
    - "extensions/*"

catalog:
    "@effect/opentelemetry": "4.0.0-beta.98"
    "@effect/vitest": "4.0.0-beta.98"
    "@noble/hashes": "^2.0.1"
    "@opentelemetry/api": "^1.9.0"
    "@opentelemetry/api-logs": "^0.205.0"
    "@opentelemetry/resources": "^2.2.0"
    "@opentelemetry/sdk-logs": "^0.205.0"
    "@opentelemetry/sdk-metrics": "^2.2.0"
    "@opentelemetry/sdk-trace-base": "^2.2.0"
    "@opentelemetry/sdk-trace-node": "^2.2.0"
    "@opentelemetry/sdk-trace-web": "^2.2.0"
    "@opentelemetry/semantic-conventions": "^1.38.0"
    "@stylexjs/rollup-plugin": "^0.19.0"
    "@stylexjs/stylex": "^0.19.0"
    "effect": "4.0.0-beta.98"
    "@solidjs/web": "2.0.0-rc.9"
    "solid-js": "2.0.0-rc.9"
    "vite-plugin-solid": "3.0.0-next.27"

# Keep the tested Peculiar Sheets compatibility exception aligned with the source workspace.
peerDependencyRules:
    allowedVersions:
        "peculiar-sheets@0.13.0>@solidjs/web": "2.0.0-rc.9"
        "peculiar-sheets@0.13.0>solid-js": "2.0.0-rc.9"

patchedDependencies:
    solid-js@2.0.0-rc.9: patches/solid-js@2.0.0-rc.9.patch

minimumReleaseAgeExclude:
    - "solid-js@2.0.0-rc.9"
    - "@solidjs/web@2.0.0-rc.9"
    - "@solidjs/signals@2.0.0-rc.9"
    - "@solidjs/vite-plugin@3.0.0-next.44"
    - "@solidjs/babel-plugin@2.0.0-rc.9"
    - "@solidjs/compiler@2.0.0-rc.9"
    - "@solidjs/compiler-darwin-arm64@2.0.0-rc.9"
    - "@solidjs/compiler-darwin-x64@2.0.0-rc.9"
    - "@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.9"
    - "@solidjs/compiler-linux-x64-gnu@2.0.0-rc.9"
    - "@solidjs/compiler-wasm32-wasi@2.0.0-rc.9"
    - "@solidjs/compiler-win32-x64-msvc@2.0.0-rc.9"
