; Authored GatherText recipe input for a project with no compiled module or Dashboard.
[CommonSettings]
SourcePath=Content/Localization/Fixture427
DestinationPath=Content/Localization/Fixture427
ManifestName=Fixture427.manifest
ArchiveName=Fixture427.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=fr

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=FixtureSource
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=GenerateGatherArchive

[GatherTextStep3]
CommandletClass=InternationalizationExport
bExportLoc=true
PortableObjectName=Fixture427.po
LocalizedTextCollapseMode=IdenticalTextIdAndSource
POFormat=Unreal
ShouldPersistCommentsOnExport=true
bUseCultureDirectory=true

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource
ResourceName=Fixture427.locres
bSkipSourceCheck=false

[GatherTextStep5]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Fixture427.csv
bConflictReport=true
ConflictReportName=Fixture427_Conflicts.txt
