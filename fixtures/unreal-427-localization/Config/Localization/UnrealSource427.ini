; Plan 060's scanner oracle on UE 4.27: the stock commandlet gathers the 5.x fixture's source cases
; as text. 4.27 has no wrapper prepass, localized logs or developer notes, so those cases gather
; nothing here. The two String Table CSVs are copied under this project's Content, where 4.27
; resolves LOCTABLE_FROMFILE_GAME. StringTablesUnregistered.cpp crashes the 4.27 gather (an access
; violation on entries of a table the file never registers), so it is excluded.
[CommonSettings]
SourcePath=Content/Localization/UnrealSource427
DestinationPath=Content/Localization/UnrealSource427
ManifestName=UnrealSource427.manifest
ArchiveName=UnrealSource427.archive
NativeCulture=en
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=../unreal-project/FixtureSource/UnrealSource
FileNameFilters=*.cpp
FileNameFilters=*.ini
ExcludePathFilters=../unreal-project/FixtureSource/UnrealSource/StringTablesUnregistered.cpp
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest
