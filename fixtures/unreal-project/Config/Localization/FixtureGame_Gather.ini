[CommonSettings]
ModulesToPreload=UEShedFixture
SourcePath=Content/Localization/FixtureGame
DestinationPath=Content/Localization/FixtureGame
ManifestName=FixtureGame.manifest
ArchiveName=FixtureGame.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=fr

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/UEShedFixture
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Content/Fixture/Localization/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=%LOCPROJECTROOT%Content/L10N/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=true

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=FixtureGame.csv
bConflictReport=true
ConflictReportName=FixtureGame_Conflicts.txt

