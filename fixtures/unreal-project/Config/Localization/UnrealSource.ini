; Gather-only source text for Plan 060's scanner oracle. Unreal's GatherTextFromSource reads the
; cases in FixtureSource/UnrealSource as text; editor-only text is left out, as most games gather.
[CommonSettings]
SourcePath=Content/Localization/UnrealSource
DestinationPath=Content/Localization/UnrealSource
ManifestName=UnrealSource.manifest
ArchiveName=UnrealSource.archive
NativeCulture=en
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=FixtureSource/UnrealSource
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest
