; The same cases as UnrealSource.ini, gathering editor-only text too, so the oracle shows which
; text Unreal treats as editor-only.
[CommonSettings]
SourcePath=Content/Localization/UnrealSourceEditor
DestinationPath=Content/Localization/UnrealSourceEditor
ManifestName=UnrealSourceEditor.manifest
ArchiveName=UnrealSourceEditor.archive
NativeCulture=en
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=FixtureSource/UnrealSource
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=true

[GatherTextStep1]
CommandletClass=GenerateGatherManifest
