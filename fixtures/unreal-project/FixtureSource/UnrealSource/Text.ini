; Gather-only. INI files gather only loc macros: a [Section] is the namespace for LOCTEXT, an
; explicit NSLOCTEXT namespace loses its package marker, and plain values gather nothing.

[UnrealSource.Config]
Greeting=Plain values are never gathered
Welcome=LOCTEXT("Welcome", "Welcome aboard")
Tip=(Title=NSLOCTEXT("[/Script/UnrealSource]", "TipTitle", "Tip"),Body=NSLOCTEXT("UnrealSource.Tips", "TipBody", "Check the tide table"))
