[package]
name = "uasset-decode"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
uasset-parser = { path = "../../../crates/uasset-parser" }
uasset-inspection = { path = "../../../crates/uasset-inspection" }
serde_json = "1.0"
sha2 = "0.10"

# Mirrors the root release profile; must be kept in sync.
[profile.release]
lto = "fat"
codegen-units = 1

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
